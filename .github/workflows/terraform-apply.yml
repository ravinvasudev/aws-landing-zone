# Terraform Apply on Merge to Main
# Applies approved changes after merge

name: Terraform Apply

on:
  push:
    branches:
      - main
    paths:
      - 'environments/**'

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.5.7"
  AWS_REGION: "us-east-1"

jobs:
  # --------------------------------------------------------------------------
  # Detect changed environments
  # --------------------------------------------------------------------------
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.changes.outputs.environments }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed environments
        id: changes
        run: |
          # Find all changed environment directories in this push
          CHANGED_DIRS=$(git diff --name-only HEAD~1 HEAD | grep '^environments/' | cut -d'/' -f2 | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "environments=$CHANGED_DIRS" >> $GITHUB_OUTPUT
          echo "Changed environments: $CHANGED_DIRS"

  # --------------------------------------------------------------------------
  # Terraform Apply
  # --------------------------------------------------------------------------
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.environments != '[]'
    strategy:
      max-parallel: 1  # Apply one environment at a time
      matrix:
        environment: ${{ fromJson(needs.detect-changes.outputs.environments) }}
    environment: ${{ matrix.environment }}  # Requires GitHub environment approval
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: environments/${{ matrix.environment }}
        run: terraform init

      - name: Terraform Apply
        working-directory: environments/${{ matrix.environment }}
        run: terraform apply -auto-approve -input=false

      - name: Notify on Failure
        if: failure()
        run: |
          echo "::error::Terraform apply failed for ${{ matrix.environment }}"
          # TODO: Add Slack/Teams notification here
